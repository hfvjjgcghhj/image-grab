<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>图提取 - 图片预览</title>
  <link rel="stylesheet" href="gallery.css" />
</head>
<body>
  <!-- 顶部工具栏 -->
  <header class="toolbar">
    <div class="toolbar-inner">
      <h1 class="logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="4" fill="url(#g1)" />
          <circle cx="9" cy="9" r="2" fill="#fff" />
          <path d="M5 18l5-5 3 3 4-4 3 3" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
          <defs><linearGradient id="g1" x1="0" y1="0" x2="24" y2="24"><stop stop-color="#6a5cff"/><stop offset="1" stop-color="#3b82f6"/></linearGradient></defs>
        </svg>
        图提取 · 图片预览
      </h1>
      <div class="actions">
        <button id="btn-select-all" class="btn btn-ghost">全选</button>
        <button id="btn-invert" class="btn btn-ghost">反选</button>
        <span class="count">已选 <strong id="selected-count">0</strong> 张</span>
        <button id="btn-download" class="btn btn-primary" disabled>下载选中</button>
      </div>
    </div>
  </header>

  <!-- 图片网格 -->
  <main class="gallery" id="gallery">
    <!-- 图片卡片由 gallery.js 动态生成 -->
  </main>

  <!-- 空状态 -->
  <div class="empty" id="empty" hidden>
    <p>暂无图片</p>
    <p class="sub">请回到商品详情页，点击右下角「获取图片」按钮</p>
  </div>

  <!-- 进度提示 -->
  <div class="toast" id="toast" hidden></div>

  <script src="gallery.js"></script>
</body>
</html>
